name: Space Shooter

on:
  schedule:
    - cron: "30 3 * * *"     # daily, 09:00 IST (offset from your other workflows)
  workflow_dispatch:          # run it manually from the Actions tab

permissions:
  contents: write

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # required so the action can amend its own previous commit

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/space-shooter.gif
          strategy: random    # column | row | random
          fps: 30             # lower = smaller file, faster load
          commit-message: "chore: refresh space shooter"
